    <script>
      // Ensure window.fetch is writable and configurable so browser extensions can attach their request interceptors without throwing
      try {
        let _appFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() {
            return _appFetch;
          },
          set(val) {
            _appFetch = val;
          }
        });
      } catch (e) {
        // Safe to ignore
      }
    </script>
